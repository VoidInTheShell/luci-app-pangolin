name: Build and release Pangolin

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pangolin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release version
        id: version
        run: |
          python3 scripts/release-version.py --ref "$GITHUB_REF" \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo 'Stable tags must refer to a commit already merged into main.' >&2
              exit 1
            }
          fi
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Static and regression checks
        run: bash tests/check.sh
      - name: Exercise RPC in disposable OpenWrt
        run: bash tests/test_rpc_backends_openwrt.sh

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            target: rockchip
            subtarget: armv8
            platform: linux/arm64
          - arch: x86_64
            target: x86
            subtarget: '64'
            platform: linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENWRT_VERSION: '25.12.5'
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      OPENWRT_PACKAGE_ARCH: ${{ matrix.arch }}
      PANGOLIN_CLIENT_ONLY: '1'
      PANGOLIN_PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
      PANGOLIN_PACKAGE_RELEASE: ${{ needs.checks.outputs.revision }}
      NEWT_USE_EXTERNAL_GO: '1'
      PANGOLIN_USE_EXTERNAL_GO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'aarch64_generic'
        with:
          platforms: arm64
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl \
            file gawk gettext jq libncurses-dev python3 python3-setuptools rsync unzip wget zstd
      - name: Restore downloaded source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/*.tar.*
          key: pangolin-25.12.5-${{ matrix.arch }}-archives-v1
      - name: Prepare signing key
        env:
          SIGNING_KEY_B64: ${{ github.event_name != 'pull_request' && secrets.PANGOLIN_APK_PRIVATE_KEY_B64 || '' }}
        run: |
          umask 077
          key="$RUNNER_TEMP/pangolin-signing.pem"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            openssl ecparam -name prime256v1 -genkey -noout -out "$key"
            openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pangolin-public-key.pem"
            echo "OPENWRT_PUBLIC_KEY_FILE=$RUNNER_TEMP/pangolin-public-key.pem" >> "$GITHUB_ENV"
          else
            test -n "$SIGNING_KEY_B64" || { echo 'Missing PANGOLIN_APK_PRIVATE_KEY_B64' >&2; exit 1; }
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$key"
            echo "OPENWRT_PUBLIC_KEY_FILE=$GITHUB_WORKSPACE/keys/pangolin-public-key.pem" >> "$GITHUB_ENV"
          fi
          echo "OPENWRT_APK_PRIVATE_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Build signed client packages and repository
        run: bash scripts/build-openwrt.sh
      - name: Verify package signatures, payload and target execution
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/verify-client-release.py
      - name: Bundle architecture-specific installation files
        env:
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
        run: |
          mkdir -p dist/release
          tar -czf "dist/release/luci-app-pangolin-${RELEASE_TAG}-openwrt-25.12.5-${OPENWRT_PACKAGE_ARCH}.tar.gz" \
            -C "dist/openwrt-25.12.5/${OPENWRT_PACKAGE_ARCH}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pangolin-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pangolin-signing.pem" .cache/*/private-key.pem

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pangolin-*
          path: release
          merge-multiple: true
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
        run: |
          test "$(find release -name '*.tar.gz' | wc -l)" -eq 2
          cp keys/pangolin-public-key.pem release/
          (cd release && sha256sum *.tar.gz pangolin-public-key.pem > SHA256SUMS)
          cat > release-notes.md <<EOF
          OpenWrt 25.12.5 / ARM64 (aarch64_generic) and x86_64.
          Source: ${GITHUB_SHA}
          Bundled Pangolin CLI: 0.18.1; Newt: 1.18.1; OLM: 1.10.1.

          Download the archive matching your device architecture and follow INSTALL.txt inside it.
          Both APKs and the repository index are signed with pangolin-public-key.pem.
          Development releases are prereleases; stable releases require a manually pushed v<VERSION> tag on main.
          EOF
          args=(--target "$GITHUB_SHA" --title "Pangolin ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" "${args[@]}"
          gh release upload "$RELEASE_TAG" release/* --clobber
