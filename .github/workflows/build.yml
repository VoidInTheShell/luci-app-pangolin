name: Build OpenWrt packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r5c:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file gawk gettext \
            jq libncurses-dev python3 python3-setuptools rsync shellcheck \
            unzip wget zstd

      - name: Static checks
        run: ./tests/check.sh

      - name: Restore SDK and download caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: openwrt-sdk-25.12.5-rockchip-armv8-v1

      - name: Install stable APK signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          OPENWRT_APK_PRIVATE_KEY_B64: ${{ secrets.OPENWRT_APK_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$OPENWRT_APK_PRIVATE_KEY_B64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo 'OPENWRT_APK_PRIVATE_KEY_B64 is required for release tags.' >&2
              exit 1
            fi
            exit 0
          fi
          printf '%s' "$OPENWRT_APK_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/openwrt-newt-private-key.pem"
          chmod 0600 "$RUNNER_TEMP/openwrt-newt-private-key.pem"
          echo "OPENWRT_APK_PRIVATE_KEY_FILE=$RUNNER_TEMP/openwrt-newt-private-key.pem" >> "$GITHUB_ENV"

      - name: Build APKs and feed index
        env:
          NEWT_USE_EXTERNAL_GO: '1'
          PANGOLIN_USE_EXTERNAL_GO: '1'
        run: ./scripts/build-openwrt.sh

      - name: Verify signed artifacts and ARM64 execution
        run: ./scripts/verify-artifacts-in-docker.sh

      - name: Build generic NanoPi R5C images
        run: ./scripts/build-r5c-image.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-pangolin-25.12.5-aarch64_generic
          path: dist/openwrt-25.12.5/aarch64_generic/
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-r5c
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrt-pangolin-25.12.5-aarch64_generic
          path: dist/openwrt-25.12.5/aarch64_generic

      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Pangolin for OpenWrt ${GITHUB_REF_NAME}" \
              --generate-notes
          mapfile -t assets < <(find dist/openwrt-25.12.5/aarch64_generic \
            -type f -not -name '.DS_Store' | sort)
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
